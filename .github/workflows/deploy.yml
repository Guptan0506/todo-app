name: Build and Deploy to GitHub Pages

# Provide write permissions so the deploy action can push to gh-pages
permissions:
  contents: write
  pages: write

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure build/index.html exists and strip any CNAME
        run: |
          if [ -f build/index.light.html ]; then cp build/index.light.html build/index.html; fi
          # Remove any CNAME from the build so deployment does not use a custom domain
          if [ -f build/CNAME ]; then rm build/CNAME; fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: build # The folder the action should deploy.
